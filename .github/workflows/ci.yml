name: ci

# The e2e suite is sharded across runners because that is the whole point of
# one derivation per scenario: adding the fiftieth scenario should add a job,
# not lengthen an existing one. The matrix is read from the scenario directory,
# so a new scenario appears in CI without this file being edited.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests and coverage floors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: gofmt and go vet
        run: nix build -L .#checks.x86_64-linux.gofmt

      - name: covcheck's own tests
        run: nix build -L .#checks.x86_64-linux.covcheck

      - name: unit coverage
        run: nix build -L .#checks.x86_64-linux.unit --out-link unit-coverage

      - name: report
        run: |
          nix run .#covcheck -- report -i unit-coverage/unit.profile -root .
          nix run .#covcheck -- report -i unit-coverage/unit.profile -root . \
            -format markdown >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: unit-coverage/raw
          retention-days: 7

  scenarios:
    name: list scenarios
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          names=$(ls nix/e2e/scenarios/*.nix | xargs -n1 basename | sed 's/\.nix$//')
          echo "matrix=$(printf '%s\n' "$names" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  e2e:
    name: e2e ${{ matrix.scenario }}
    needs: scenarios
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(needs.scenarios.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      # NixOS VM tests need KVM. The runner has the device but not the
      # permissions, which is a udev rule rather than a capability problem.
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm

      - name: run scenario
        run: nix build -L .#checks.x86_64-linux.e2e-${{ matrix.scenario }} --out-link scenario-out

      - uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-${{ matrix.scenario }}
          path: scenario-out/kura-coverage
          retention-days: 7

  coverage:
    name: merged coverage
    needs: [unit, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: actions/download-artifact@v4
        with:
          path: counters

      # Every artifact is a directory of raw covdata counters, whatever
      # produced them. Merging is one command over all of them.
      - name: merge and gate
        run: |
          dirs=$(find counters -mindepth 1 -maxdepth 1 -type d | paste -sd,)
          echo "merging: $dirs"
          nix develop --command bash -c "
            go tool covdata textfmt -i='$dirs' -o=merged.profile
            go tool cover -html=merged.profile -o=coverage.html
            covcheck report -i merged.profile -root . -format markdown >> '$GITHUB_STEP_SUMMARY'
            covcheck uncovered -i merged.profile -root . -n 30 > uncovered.txt
            covcheck gate -i merged.profile -root . -v
          "

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            merged.profile
            coverage.html
            uncovered.txt
          retention-days: 30
